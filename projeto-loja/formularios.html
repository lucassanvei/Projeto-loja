<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="#" method="post">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" required autofocus maxlength="50"
        placeholder="Digite seu Nome">
        <br><br>
        <label for="email">e-mail:</label>
        <input type="email" id="email" required maxlength="50"
        placeholder="digite seu e-mail">
        <br><br>
        <label for="Senha">Senha:</label>
        <input type="password" id="Senha" required maxlength="15"
        placeholder="digite sua senha">
        <br><br>
        <input type="submit" value="Cadastrar" id="cadastrar" name="cadastrar">
        <input type="reset" value="Limpar" id="limpar" name="Limpar">
    </form>



</body>

</html>
