<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>
    <h1>Formulario de cadastro</h1>
    <form action="#" method="get">
        <label for="nome">nome</label>
        <input type="Nome" id="Nome" maxlength="50" required
        placeholder="Digite seu nome" autofocus>
        <label for="email">email</label>
        <input type="email" id="email" maxlength="50" required
        placeholder="Digite seu email" autocomplete="off">
        <label for="estado">estado</label>
        <select name="estado" id="estado">
            <option value="sp">São Paulo</option>
            <option value="mg">Minas gerais</option>
            <option value="rj">Rio de Janeiro</option>
            <option value="am">Amazonas</option>
        </select>
        <br><br>

        <label for="area">Escolha seu time</label>
        <br>
        <input type="checkbox" id="tec"><label for="san">Santos</label>
        <br>
        <input type="checkbox" id="tec"><label for="pal">Palmeiras</label>
        <br>
        <input type="checkbox" id="tec"><label for="cur">corinthians</label>
        <br>
        <input type="checkbox" id="tec"><label for="sao">São Paulo</label>
        <br>
        <label for="formaPag">Selecione a forma de pagamento</label>
        <br>
        <input type="radio" name="pagamento" id="pix" value="pix">
        <label for="pix">pix (5% de desconto)</label>
        <br>
        <input type="Radio" name="pagamento" id="cartao" value="cartao_credito">
        <label for="cartao">Cartão de Crédito</label>
        <br>
        <input type="radio" name="pagamento" id="boleto" value="boleto">
        <label for="boleto">Boleto Bancário</label>
        <br>
        <input type="date" id="calendario">
        <br>
        <input type="submit" value="enviar">
        <input type="reset" value="enviar">
        




    </form>

</body>

</html>
